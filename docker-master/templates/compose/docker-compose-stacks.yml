# Templates Prontos para Uso (Docker Compose) 🚀

> Templates completos, testados e otimizados para execução leve no **Kiri**, **Podman** e **Docker Engine**, com isolamento de rede, persistência em volumes e boas práticas de variáveis de ambiente.

---

## 🐘 1. Stack Web Moderna: PHP 8.4 FrankenPHP + PostgreSQL 17 + Redis 7

```yaml
services:
  app:
    image: dunglas/frankenphp:latest-alpine
    container_name: web-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ":80"
      DATABASE_URL: "postgres://postgres:secret@db:5432/app_db"
      REDIS_HOST: "redis"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal-net

  db:
    image: postgres:17-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal-net

volumes:
  pgdata:

networks:
  internal-net:
    driver: bridge
```

