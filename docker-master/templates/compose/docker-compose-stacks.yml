## 🟢 2. Stack Node.js 22 + MongoDB 8 + Redis

```yaml
services:
  api:
    image: node:22-alpine
    container_name: node-api
    working_dir: /app
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGO_URI: "mongodb://mongo:27017/meu-banco"
      REDIS_HOST: "cache"
    depends_on:
      - mongo
      - cache
    networks:
      - app-network

  mongo:
    image: mongo:8-noble
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - app-network

  cache:
    image: redis:7-alpine
    container_name: cache
    networks:
      - app-network

volumes:
  mongodata:

networks:
  app-network:
    driver: bridge
```

